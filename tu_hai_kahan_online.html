<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160d18">
  <title>Tu Hai Kahan — AUR | Animated Lyrics</title>
  <style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --accent: #f28ab2;
  --accent-strong: #db8ab7b7;
  --text: #fff8fc;
}

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  padding: clamp(16px, 4vw, 48px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background-color: #160d18;
  background-image:
    linear-gradient(rgba(15, 7, 18, 0.55), rgba(15, 7, 18, 0.78)),
    url("bg.jpeg.jpeg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.player {
  width: min(100%, 900px);
  min-height: min(540px, 80vh);
  padding: clamp(24px, 6vw, 64px) clamp(16px, 5vw, 48px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  text-align: center;
  background: rgba(20, 10, 22, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 28px;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.music-note {
  color: var(--accent);
  font-size: clamp(38px, 7vw, 64px);
  line-height: 1;
  text-shadow: 0 0 24px rgba(242, 138, 178, 0.65);
}

.eyebrow {
  margin: 0;
  font-size: 0.75rem;
  letter-spacing: 0.28em;
  opacity: 0.8;
}

.title {
  margin: 0;
  font-size: clamp(1.8rem, 5vw, 3rem);
  letter-spacing: 0.04em;
}

.lyrics {
  width: 100%;
  min-height: 3.2em;
  margin: clamp(12px, 3vh, 28px) 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-wrap: anywhere;
  font-size: clamp(1.25rem, 4.4vw, 2.8rem);
  line-height: 1.35;
  font-weight: 700;
  color: var(--accent);
  text-shadow: 0 0 14px rgba(240, 0, 90, 0.55);
  transition: opacity 180ms ease;
}

.lyrics.is-typing {
  opacity: 0.96;
}

button {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 24px;
  border: 0;
  border-radius: 999px;
  background: var(--accent-strong);
  color: #160d18;
  font: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 180ms ease, filter 180ms ease;
}

button:hover {
  filter: brightness(1.12);
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.98);
}

button:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

.status {
  min-height: 1.2em;
  margin: 0;
  font-size: 0.85rem;
  opacity: 0.78;
}


.video-wrap {
  width: min(100%, 560px);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 10px 35px rgba(0,0,0,.3);
}
.video-wrap iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
    background-attachment: scroll;
  }

  .player {
    min-height: 70svh;
    padding: 28px 18px;
    gap: 12px;
    border-radius: 22px;
  }

  .lyrics {
    min-height: 4.2em;
    margin: 18px 0;
    font-size: clamp(1.25rem, 6vw, 2rem);
  }

  button {
    width: min(100%, 240px);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

  </style>

</head>
<body>

  <script src="https://www.youtube.com/iframe_api"></script>

  { time: 93, text: "💖Gaa leta hu tere liye, mausiqi nahi hai pesha" },

   { time: 227, text: "💖Tu hai kaha, khwabo ke iss sheher me mera dil tujhe dhund taa" },
 { time: 237, text: "💖Dhund taa............." },
 { time: 239, text: "💖Arsaa hua, tujhko dekha nahi" },
 { time: 244, text: "💖Tu na jaane kaha chup gaya" },
 { time: 248, text: "💖Chup gaya..........." },


];

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId,
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { statusText.textContent = "Online music ready — tap Play song ✨"; },
          onStateChange: onPlayerStateChange,
          onError: () => { statusText.textContent = "Video unavailable here. Open YouTube and search ‘Tu Hai Kahan AUR official’."; }
        }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function stopTyping() {
      if (typingTimer !== null) { clearInterval(typingTimer); typingTimer = null; }
      lyricsDiv.classList.remove("is-typing");
    }
    function typeLine(text, speed = 34) {
      stopTyping(); activeLine = text; lyricsDiv.textContent = "";
      lyricsDiv.classList.add("is-typing");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        lyricsDiv.textContent = text; lyricsDiv.classList.remove("is-typing"); return;
      }
      let i = 0;
      typingTimer = window.setInterval(() => {
        if (activeLine !== text) { stopTyping(); return; }
        lyricsDiv.textContent += text.charAt(i++);
        if (i >= text.length) stopTyping();
      }, speed);
    }
    function syncLyrics() {
      if (!player || typeof player.getCurrentTime !== "function") return;
      const time = player.getCurrentTime();
      while (currentIndex < lyricsData.length && time >= lyricsData[currentIndex].time) {
        typeLine(lyricsData[currentIndex].text);
        currentIndex++;
      }
    }
    function updatePlayButton(isPlaying) {
      playIcon.textContent = isPlaying ? "Ⅱ" : "▶";
      playLabel.textContent = isPlaying ? "Pause song" : "Play song";
      playBtn.setAttribute("aria-label", isPlaying ? "Pause song" : "Play song");
    }
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        updatePlayButton(true);
        statusText.textContent = "Now playing online — Tu Hai Kahan by AUR ✨";
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(syncLyrics, 200);
      } else {
        updatePlayButton(false);
        if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
        if (event.data === YT.PlayerState.ENDED) statusText.textContent = "Song finished — tap Play song to listen again.";
        else if (event.data === YT.PlayerState.PAUSED) statusText.textContent = "Song paused";
      }
    }
    playBtn.addEventListener("click", () => {
      if (!player || typeof player.playVideo !== "function") {
        statusText.textContent = "Loading YouTube player… please try again in a moment."; return;
      }
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) { player.pauseVideo(); return; }
      if (!startedOnce || state === YT.PlayerState.ENDED) {
        player.seekTo(lyricsStartTime, true);
        currentIndex = 0;
        lyricsDiv.textContent = "♪";
        startedOnce = true;
      } else {
        const t = player.getCurrentTime();
        currentIndex = lyricsData.findIndex(item => item.time > t);
        if (currentIndex < 0) currentIndex = lyricsData.length;
      }
      player.playVideo();
    });
    // Keep the lyric display aligned when users seek with YouTube's controls.
    window.setInterval(() => {
      if (!player || typeof player.getCurrentTime !== "function") return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) return;
      const t = player.getCurrentTime();
      const next = lyricsData.findIndex(item => item.time > t);
      const idx = next < 0 ? lyricsData.length : next;
      if (idx !== currentIndex) {
        currentIndex = idx;
        const previous = [...lyricsData].reverse().find(item => item.time <= t);
        if (previous) typeLine(previous.text);
      }
    }, 700);
  </script>
